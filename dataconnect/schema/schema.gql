type Couple @table {
  partnerName1: String!
  partnerName2: String!
  weddingDate: Date!
  weddingLocation: String
  registryLink: String
}

type Guest @table {
  name: String!
  email: String!
  dietaryRestrictions: String
  plusOneCount: Int
  couple: Couple!
}

type Event @table {
  title: String!
  eventDate: Timestamp!
  location: String!
  description: String
  couple: Couple!
}

type RSVP @table {
  status: String!
  note: String
  guest: Guest!
  event: Event!
}

type Document @table {
  title: String!
  url: String!
  description: String
  couple: Couple!
}

# --- Login-Free Guest Pass & AI Biometrics Tables ---

type GuestPass @table {
  tokenHash: String!
  eventId: String!
  eventName: String!
  guestName: String
  guestPhone: String
  expiresAt: Timestamp
  isRevoked: Boolean!
  revokedAt: Timestamp
  revokedReason: String
  maxScans: Int
  scanCount: Int!
  lastAccessedAt: Timestamp
  createdAt: Timestamp!
}

type FaceSearchSession @table {
  guestPassId: String!
  eventId: String!
  matchesCount: Int!
  highestSimilarity: Float
  latencyMs: Int!
  status: String!
  engine: String!
  createdAt: Timestamp!
}

type GuestAccessLog @table {
  guestPassId: String!
  action: String!
  ipAddress: String
  userAgent: String
  timestamp: Timestamp!
}

type PhotoProcessingJob @table {
  eventId: String!
  photoId: String!
  photoUrl: String!
  status: String!
  facesDetected: Int
  errorMessage: String
  attempts: Int!
  createdAt: Timestamp!
  completedAt: Timestamp
}
