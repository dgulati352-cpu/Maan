mutation CreateCouple($partner1: String!, $partner2: String!, $date: Date!) @auth(level: USER) {
  couple_insert(data: { partnerName1: $partner1, partnerName2: $partner2, weddingDate: $date })
}

mutation UpdateCouple($id: UUID!, $location: String) @auth(level: USER) {
  couple_update(id: $id, data: { weddingLocation: $location })
}

mutation DeleteCouple($id: UUID!) @auth(level: USER) {
  couple_delete(id: $id)
}

query GetCouple($id: UUID!) @auth(level: USER) {
  couple(id: $id) { partnerName1 partnerName2 weddingDate }
}

query ListCouples @auth(level: USER) {
  couples { partnerName1 partnerName2 }
}

mutation CreateGuest($name: String!, $email: String!, $coupleId: UUID!) @auth(level: USER) {
  guest_insert(data: { name: $name, email: $email, coupleId: $coupleId })
}

mutation UpdateGuest($id: UUID!, $diet: String) @auth(level: USER) {
  guest_update(id: $id, data: { dietaryRestrictions: $diet })
}

mutation DeleteGuest($id: UUID!) @auth(level: USER) {
  guest_delete(id: $id)
